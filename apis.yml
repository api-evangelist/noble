name: Noble
description: >-
  Noble (operated by Benga Inc.) is a no-code risk and credit decisioning
  platform that provides risk infrastructure for the full customer lifecycle.
  Fintech companies, lenders, and banks use Noble to verify customer identity,
  aggregate and assess credit and financial-health data from multiple sources,
  build and launch automated underwriting and decisioning workflows with a
  no-code Workflow Builder, and monitor customer behavior and creditworthiness
  over time. Noble exposes this capability as a SaaS platform, an API, and an
  embeddable widget, plus pre-built data-partner integrations, so teams can
  build, launch, and scale digital financial products faster. Founded in 2021
  and based in San Mateo, California, Noble is a Y Combinator company backed by
  Insight Partners, Paradigm, and Polychain.
